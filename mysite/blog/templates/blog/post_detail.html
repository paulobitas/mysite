{% extends "blog/base.html" %}
{% block content %}
    <h1>Blog do Paulo Home!</h1>
    <p>This is the home page of my blog.</p>
    
    <article class="media content-section">
        <!-- acrescentar imagem do autor -->
        <img class = "rounded-circle article-img" src = "{{ object.author.profile.image.url }}">
        <div class="media-body">
            <div class="article-metadata">
            <a class="mr-2" href="{% url 'user-posts' object.author.username %}">{{ object.author }}</a>
            <small class="text-muted">{{ object.date_posted|date:"Y F d, D, H:i e"}}</small> <!-- Documentação sobre formato de datas: https://docs.djangoproject.com/en/2.0/ref/templates/builtins/#date  -->
            {% if object.author == user %}
                <div>
                    <a class="btn btn-secondary btn-sm mt-1 mb-1" href="{% url 'post-update' object.id %}">Update</a>
                    <a class="btn btn-danger btn-sm mt-1 mb-1" href="{% url 'post-delete' object.id %}">Delete</a>
                </div>                
            {% endif %}
            </div>
            <h2 class="article-title">{{ object.title }}</h2>
            <p class="article-content">{{ object.content }}</p>
        </div>
    </article>
    <!-- <p> random number: {{post.random_number}}</p> -->
    
{% endblock content %}
